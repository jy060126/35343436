<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stellar To-Do List</title>
    <style>
        :root {
            --main-bg: #020617;
            --card-bg: rgba(15, 23, 42, 0.75);
            --accent-glow: rgba(125, 211, 252, 0.5);
        }

        /* 🌌 심해와 같은 밤하늘 배경 */
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Pretendard', sans-serif;
            background: radial-gradient(circle at top right, #1e1b4b 0%, #020617 100%);
            overflow: hidden;
            color: #f1f5f9;
        }

        /* ✨ 은하수 레이어 */
        .milky-way {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                radial-gradient(1px 1px at 10% 10%, #fff, transparent),
                radial-gradient(1px 1px at 50% 20%, #fff, transparent),
                radial-gradient(1.5px 1.5px at 80% 40%, #ddd, transparent),
                radial-gradient(1px 1px at 30% 80%, #fff, transparent);
            background-size: 300px 300px;
            opacity: 0.4;
            z-index: 0;
        }

        /* 🌠 별똥별 (2초 주기, 우상단 -> 좌하단) */
        .shooting-star {
            position: absolute;
            top: -10%;
            right: -10%;
            width: 150px; /* 꼬리 길이 */
            height: 2px;
            background: linear-gradient(90deg, rgba(255,255,255,1), transparent);
            transform: rotate(-35deg); /* 떨어지는 각도 */
            opacity: 0;
            z-index: 1;
            animation: shoot-fast 2s linear infinite;
        }

        @keyframes shoot-fast {
            0% {
                transform: translate(0, 0) rotate(-35deg) scaleX(0);
                opacity: 0;
            }
            10% {
                opacity: 1;
                transform: translate(-20vw, 20vh) rotate(-35deg) scaleX(1);
            }
            30% {
                opacity: 0;
                transform: translate(-100vw, 100vh) rotate(-35deg) scaleX(1.5);
            }
            100% {
                opacity: 0;
                transform: translate(-100vw, 100vh) rotate(-35deg);
            }
        }

        /* 🕊️ 유영하는 졸라맨 */
        .stickman { position: absolute; width: 45px; height: 45px; opacity: 0.25; z-index: 1; }
        @keyframes float-gentle {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            50% { transform: translate(15px, -15px) rotate(3deg); }
        }

        /* 투두리스트 컨테이너 */
        .todo-container {
            position: relative;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            width: 420px;
            max-height: 80vh;
            padding: 40px;
            border-radius: 35px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
            z-index: 10;
            display: flex;
            flex-direction: column;
        }

        h2 { font-weight: 200; text-align: center; letter-spacing: 6px; color: #fff; margin-bottom: 30px; font-size: 1.5rem; }

        .input-area { display: flex; flex-direction: column; gap: 15px; margin-bottom: 30px; }
        input, select {
            background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.1);
            padding: 14px; border-radius: 12px; color: white; font-size: 0.9rem; outline: none; transition: 0.3s;
        }
        input:focus { border-color: var(--accent-glow); background: rgba(255,255,255,0.12); }
        
        #add-btn {
            background: #fff; color: #020617; border: none; padding: 14px; border-radius: 12px;
            font-weight: 600; cursor: pointer; transition: 0.3s; margin-top: 5px;
        }
        #add-btn:hover { background: #cbd5e1; transform: translateY(-2px); }

        ul { list-style: none; padding: 0; overflow-y: auto; flex: 1; }
        li {
            background: rgba(255,255,255,0.03); padding: 18px; border-radius: 16px;
            margin-bottom: 12px; display: flex; justify-content: space-between;
            align-items: center; border: 1px solid rgba(255,255,255,0.05);
            animation: fadeIn 0.5s ease forwards;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .completed { opacity: 0.3; filter: blur(0.5px); }
        .completed .todo-text { text-decoration: line-through; }
        
        .meta { font-size: 0.75rem; color: #64748b; margin-top: 5px; display: flex; gap: 10px; }
        .p-high { color: #fda4af; }
    </style>
</head>
<body>

<div class="milky-way"></div>
<!-- 별똥별 레이어 -->
<div class="shooting-star"></div>
<div id="stage"></div>

<div class="todo-container">
    <h2>STARDUST</h2>
    <div class="input-area">
        <input type="text" id="todo-input" placeholder="기록하고 싶은 생각을 적어보세요">
        <div style="display:flex; gap:10px;">
            <input type="time" id="todo-time" style="flex:1.2;">
            <select id="todo-priority" style="flex:1;">
                <option value="중요">✨ 중요</option>
                <option value="보통" selected>🌙 보통</option>
                <option value="여유">☁️ 여유</option>
            </select>
        </div>
        <button id="add-btn" onclick="addTodo()">은하수에 새기기</button>
    </div>
    <ul id="todo-list"></ul>
</div>

<script>
    // 10마리의 유영하는 졸라맨 생성
    const stage = document.getElementById('stage');
    for(let i=0; i<10; i++) {
        const s = document.createElement('div');
        s.className = 'stickman';
        s.style.left = Math.random() * 95 + '%';
        s.style.top = Math.random() * 95 + '%';
        s.style.animation = `float-gentle ${6 + Math.random()*6}s infinite alternate`;
        s.innerHTML = `
        <svg viewBox="0 0 100 100">
            <circle cx="50" cy="25" r="6" fill="rgba(255,255,255,0.5)"/>
            <path d="M50 31 L50 65 M50 45 L30 35 M50 45 L70 35 M50 65 L35 85 M50 65 L65 85" 
                  stroke="rgba(255,255,255,0.5)" stroke-width="2" fill="none" stroke-linecap="round"/>
        </svg>`;
        stage.appendChild(s);
    }

    function addTodo() {
        const input = document.getElementById('todo-input');
        const timeInput = document.getElementById('todo-time');
        const priorityInput = document.getElementById('todo-priority');
        const list = document.getElementById('todo-list');

        if (!input.value.trim()) return;

        const isHigh = priorityInput.value === '중요';
        const li = document.createElement('li');
        li.innerHTML = `
            <div>
                <div class="todo-text">${input.value}</div>
                <div class="meta">
                    <span class="${isHigh ? 'p-high' : ''}">${priorityInput.value}</span>
                    <span>🕒 ${timeInput.value || '언젠가'}</span>
                </div>
            </div>
            <div style="display:flex; gap:12px;">
                <button onclick="this.parentElement.parentElement.classList.toggle('completed')" style="background:none; border:none; color:#94a3b8; cursor:pointer; font-size:1.1rem;">✓</button>
                <button onclick="this.parentElement.parentElement.remove()" style="background:none; border:none; color:#94a3b8; cursor:pointer; font-size:1.1rem;">✕</button>
            </div>`;
        
        list.prepend(li);
        input.value = "";
        input.focus();
    }
</script>

</body>
</html>
